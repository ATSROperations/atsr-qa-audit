# Nginx site for audit.atsrpl.com.au -> the app on 127.0.0.1:3000.
# Install: sudo cp deploy/nginx-audit.atsrpl.com.au.conf /etc/nginx/sites-available/audit.atsrpl.com.au
#          sudo ln -s /etc/nginx/sites-available/audit.atsrpl.com.au /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then HTTPS: sudo certbot --nginx -d audit.atsrpl.com.au   (adds the certificate and the http->https redirect)

# Slow down password guessing: 10 sign-in attempts a minute per IP (the app also locks an account after 5 fails).
limit_req_zone $binary_remote_addr zone=atsrqa_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name audit.atsrpl.com.au;

    client_max_body_size 2m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/login {
        limit_req zone=atsrqa_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
