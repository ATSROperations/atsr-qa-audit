<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ATSR B2B QA Audit</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <script>
    // Apply a saved theme before first paint so there is no flash. No saved choice = follow the device.
    try { var t = localStorage.getItem("atsr_qa_theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/">
        <img class="logo-light" src="assets/logo-h.png" alt="ATSR">
        <img class="logo-dark" src="assets/logo-h-w.png" alt="ATSR">
        <span>B2B QA Audit</span>
      </a>
      <nav>
        <a href="#/">Team</a>
        <a href="#/criteria">Checks</a>
        <a href="#/new">New audit</a>
        <a href="#/team">Manage team</a>
        <button type="button" class="theme-btn" id="theme-btn" title="Switch light / dark" aria-label="Switch light or dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </div>
  </header>
  <div id="status" class="status"></div>
  <main id="view"><p class="muted">Loading...</p></main>

  <!-- PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <!-- app -->
  <script src="js/config.js"></script>
  <script src="js/criteria.js"></script>
  <script src="js/master-data.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
